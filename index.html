<script>
(async () => {
  const root = document.getElementById('craft-pocket-demo');
  const $ = id => root.querySelector('#'+id);
  const packed=Uint8Array.from(atob(document.getElementById('cp-catalog').textContent.trim()),c=>c.charCodeAt(0));
  const data=JSON.parse(await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  root.style.setProperty('--cp-atlas',`url('${data.atlas}')`);
  root.style.setProperty('--cp-atlas-cols',data.atlasCols);
  root.style.setProperty('--cp-atlas-rows',data.atlasRows);
  const customIcons=new Map();
  const items = data.items.map(x=>({id:x[0],name:x[1],english:x[2]}));
  const ingredients = data.ingredients.map(x=>({options:x[0].map(i=>items[i].id),label:x[1]}));
  const recipes = data.recipes.map(x=>({id:x[0],kind:x[1],result:items[x[2]].id,count:x[3],ingredients:x[4].map(i=>ingredients[i]),grid:x[5]?x[5].map(i=>i<0?null:ingredients[i]):null,notes:x[6]||'',mod:x[7]||'',special:!!x[8]}));
  let itemIndex = new Map(items.map(i=>[i.id,i]));
  let state = {v:1,revision:0,sort:'material',tab:'all',query:'',kind:'',materials:[],match:'all',favorites:[],custom:[],customItems:[]};
  let screen='browse', selected=null, page=0, filterPage=0, filterQuery='', pickerPage=0, pickerQuery='', editor=null, pickerTarget=null, focusAfter=null;
  const titles={crafting_shaped:'제작대 · 배치형',crafting_shapeless:'제작대 · 자유형',smelting:'화로',blasting:'용광로',smoking:'훈연기',campfire_cooking:'모닥불',stonecutting:'석재 절단기',smithing_transform:'대장장이 작업대',smithing_trim:'갑옷 장식',brewing:'양조',crafting_dye:'제작대 · 염색',crafting_transmute:'제작대 · 변환',crafting_imbue:'제작대 · 효과 부여',crafting_decorated_pot:'장식된 도자기',custom_machine:'모드 기계 / 기타'};
  const pageSize=12;
  let browseValues=[], openedProductID=null, variantQuery='';
  const familyByItem=new Map((data.families||[]).flatMap(f=>f.items.map(id=>[id,f])));
  function productInfo(r){const custom=r.id.startsWith('custom:');const family=custom?null:familyByItem.get(r.result);return {id:family?'family:'+family.id:(custom?'custom-result:':'result:')+r.result,title:family?.name||name(r.result),family};}
  function groupProducts(values){
    const products=new Map();
    for(const r of values){const info=productInfo(r);let p=products.get(info.id);if(!p){p={...r,...info,recipes:[],itemCount:0};products.set(info.id,p);}p.recipes.push(r);}
    const result=[...products.values()];
    for(const p of result)p.itemCount=new Set(p.recipes.map(r=>r.result)).size;
    if(state.sort==='name')result.sort((a,b)=>a.title.localeCompare(b.title,'ko')||a.id.localeCompare(b.id));
    return result;
  }
  const browseObserver=new IntersectionObserver(entries=>{

  function detailHeader(title,recipe=null){return `<div class="cp-inline-heading"><span>${detailHistory[renderNodeIndex]?.relation==='usage'?'이 재료로 만드는 것':renderNodeIndex?'재료의 조합법':'선택한 조합법'}</span><div>${recipe?`<button class="cp-icon-btn ${state.favorites.includes(recipe.id)?'cp-star':''}" data-action="favorite" aria-label="${state.favorites.includes(recipe.id)?'즐겨찾기 해제':'즐겨찾기 추가'}" aria-pressed="${state.favorites.includes(recipe.id)}">${ico('star')}</button>`:''}<button class="cp-icon-btn" data-action="scroll-parent" aria-label="${renderNodeIndex?'위 조합법으로 스크롤':'아이템 목록으로 스크롤'}">${ico('arrow-up')}</button><button class="cp-icon-btn" data-action="collapse-node" aria-label="${renderNodeIndex?'이 재료 상세 접기':'조합법 접기'}">${ico('x')}</button></div></div>`;}

  function materialButton(id,extra='',label=''){const all=recipesForItem(id);const count=recipesForItem(id,selected).length;const needsOriginal=!count&&all.some(r=>r.id===selected);return `<button class="cp-material-link" data-action="material-recipe" data-id="${esc(id)}" aria-label="${esc(name(id))} 만드는 법 보기">${icon(id)}<span class="cp-material-name">${esc(label||name(id))}<span class="cp-item-sub" style="display:block">${count?'만드는 법'+(count>1?' '+count+'가지':''):needsOriginal?'원본 재료 필요':'등록된 조합법 없음'}</span></span>${extra?`<span class="cp-quantity">${extra}</span>`:''}${ico('chevron-down')}</button>`;}
  function slot(i,index,role=''){if(!i)return '<div class="cp-mini-slot cp-empty-slot" aria-label="빈 칸"></div>';const id=i.options[0];return `<button class="cp-mini-slot" data-action="material-recipe" data-id="${esc(id)}" aria-label="${esc(role||`${Math.floor(index/3)+1}행 ${index%3+1}열`)}: ${esc(name(id))} 만드는 법 보기" data-tooltip="${esc(name(id))}">${icon(id)}</button>`;}
  function resultSlot(r){return `<div class="cp-output"><div class="cp-crafted" aria-label="결과: ${esc(name(r.result))} ${r.special?'':r.count+'개'}">${icon(r.result)}${r.special?'':`<span>×${r.count}</span>`}</div><span class="cp-output-label">결과물</span></div>`;}
  function craftingDiagram(r){const arrow=`<span class="cp-craft-arrow" aria-label="만들면">${ico('arrow-right')}</span>`;let content='',note='',caption='';

  }
  function recipeMarkup(r){const groups=[];r.ingredients.forEach(i=>{const key=JSON.stringify(i);const g=groups.find(g=>g.key===key);if(g)g.n++;else groups.push({key,i,n:1});});

  function itemMarkup(id,exclude='',methodPage=0){const matches=recipesForItem(id,exclude);const needsOriginal=!matches.length&&recipesForItem(id).some(r=>r.id===exclude);methodPage=Math.min(methodPage,Math.max(0,Math.ceil(matches.length/12)-1));return detailHeader('재료의 조합법')+`<div class="cp-panel"><div class="cp-result">${icon(id)}<div><div class="cp-result-title">${esc(name(id))}</div><div class="cp-item-sub">${esc(itemIndex.get(id)?.english||id)}</div></div></div></div>${matches.length?`<h3>만드는 방법 ${matches.length}가지</h3><div class="cp-methods">${matches.slice(methodPage*12,methodPage*12+12).map(r=>`<button class="cp-method" data-action="nested-recipe" data-id="${esc(r.id)}"><span class="cp-method-title">${esc(r.result!==id?name(r.result):kindTitle(r.kind))}<span class="cp-quantity">${r.special?'규칙':'×'+r.count}</span></span><span class="cp-method-inputs">${r.ingredients.slice(0,5).map(i=>icon(i.options[0])).join('')}${r.ingredients.length>5?'<span>…</span>':''}<span>${ico('arrow-right')}</span>${icon(r.result)}</span><span class="cp-item-sub">${esc([...new Set(r.ingredients.map(i=>name(i.options[0])))].slice(0,3).join(' + '))}${r.mod?' · '+esc(r.mod):''}</span></button>`).join('')}</div>`:`<div class="cp-panel cp-no-recipe">${ico('pickaxe')}<h3>${needsOriginal?'원본 재료가 먼저 필요해요':'등록된 조합법이 없어요'}</h3><p class="cp-note">${needsOriginal?'방금 본 조합은 이 아이템을 재료로 사용합니다. 처음 얻는 방법은 현재 조합법 데이터에 포함되어 있지 않아요.':'현재 데이터에는 이 아이템을 만드는 조합법이 없습니다. 채집·채굴·전리품 등의 획득 경로는 아직 제공하지 않아요.'}</p></div>`}${descriptionPanel(id)}${matches.length>12?`<div class="cp-pager" style="margin-bottom:16px"><button class="cp-icon-btn" data-action="method-prev" aria-label="이전 제작 방법" ${methodPage===0?'disabled':''}>${ico('chevron-left')}</button><span>${methodPage+1} / ${Math.ceil(matches.length/12)}</span><button class="cp-icon-btn" data-action="method-next" aria-label="다음 제작 방법" ${(methodPage+1)*12>=matches.length?'disabled':''}>${ico('chevron-right')}</button></div>`:''}<button class="cp-btn cp-wide" data-a   function renderFilter(){show('filter');$('cp-filter').innerHTML=backHead('재료로 찾기','filter-done')+`<label class="cp-search">${ico('search')}<input id="cp-material-query" type="search" aria-label="재료 검색" placeholder="철 주괴, 참나무 판자…" value="${esc(filterQuery)}"></label><div class="cp-match"><button data-action="match" data-match="all" aria-pressed="${state.match==='all'}">모두 포함</button><button data-action="match" data-match="any" aria-pressed="${state.match==='any'}">하나 이상 포함</button></div><div id="cp-filter-chips" class="cp-chips"></div><div class="cp-selection-head"><span id="cp-material-total"></span><button class="cp-btn" data-action="clear-materials">선택 해제</button></div><div id="cp-material-list"></div><div class="cp-pager" id="cp-material-pager"></div><p class="cp-help">선택한 재료의 사용처를 찾습니다. 보유 수량은 계산하지 않습니다.</p><button class="cp-btn cp-primary cp-wide" data-action="filter-done">조합법 보기</button>`;renderMaterialList();}
  function renderMaterialList(){const q=filterQuery.trim().toLowerCase();let values=materialItems().filter(i=>[i.id,i.name,i.english].join(' ').toLowerCase().includes(q));values.sort((a,b)=>compareItems(a.id,b.id));filterPage=Math.min(filterPage,Math.max(0,Math.ceil(values.length/12)-1));$('cp-material-total').textContent=`${state.materials.length}개 선택 · 검색 ${values.length}개`;$('cp-filter-chips').innerHTML=state.materials.map(id=>`<button class="cp-chip" data-action="toggle-material" data-id="${esc(id)}">${icon(id)}<span>${esc(name(id))}</span>${ico('x')}</button>`).join('');$('cp-material-list').innerHTML=values.slice(filterPage*12,filterPage*12+12).map(i=>`<button class="cp-choice" aria-pressed="${state.materials.includes(i.id)}" data-action="toggle-material" data-id="${esc(i.id)}">${icon(i.id)}<span>${esc(i.name)}</span><span class="cp-check">${ico(state.materials.includes(i.id)?'circle-check':'circle')}</span></button>`).join('')||'<p class="cp-empty">검색된 재료가 없어요.</p>';$('cp-material-pager').innerHTML=values.length>12?`<button class="cp-icon-btn" data-action="material-prev" aria-label="이전 재료" ${filterPage===0?'disabled':''}>${ico('chevron-left')}</button><span>${filterPage+1} / ${Math.ceil(values.length/12)}</span><button class="cp-icon-btn" data-action="material-next" aria-label="다음 재료" ${(filterPage+1)*12>=values.length?'disabled':''}>${ico('chevron-right')}</button>`:'';refreshIcons();}
  function beginEditor(r=null){updateItems();editor={id:r?.id||'custom:'+Date.now().toString(36),result:r?.result||'',name:r?name(r.result):'',iconData:r?customIcons.get(r.result)||null:null,newIconData:null,mod:r?.mod||'',count:r?.count||1,kind:r?.kind||'crafting_shaped',grid:r?.grid?r.grid.map(i=>i?{...i}:null):Array(9).fill(null),inputs:r?.ingredients?[...r.ingredients]:[],notes:r?.notes||'',items:[],editing:!!r};renderEditor();}
  function captureEditor(){const f=$('cp-editor');if(!f.querySelector('#cp-output-name'))return;editor.name=$('cp-output-name').value;editor.result=$('cp-output-id').value;editor.mod=$('cp-mod-name').value;editor.count=Number($('cp-output-count').value);editor.notes=$('cp-notes').value;}

어요.</p>`:`${editor.inputs.map((i,index)=>`<div class="cp-editor-item">${icon(i.options[0])}<span class="cp-material-name">${esc(name(i.options[0]))}</span><span class="cp-quantity">×1</span><button class="cp-icon-btn cp-danger" data-action="remove-input" data-index="${index}" aria-label="재료 삭제">${ico('x')}</button></div>`).join('')}<button class="cp-btn cp-wide" data-action="pick-input">${ico('plus')}재료 추가</button>`}</div><div class="cp-panel"><label class="cp-field">아이템 설명 / 메모<textarea id="cp-notes" maxlength="500" placeholder="아이템 용도, 모드 버전, 기계, 제작 조건…">${esc(editor.notes)}</textarea></label></div><div id="cp-editor-error" class="cp-error" role="alert"></div><p class="cp-save-note">${window.CraftPocketPWA?'추가한 조합법과 아이콘은 이 기기에 저장됩니다. 백업 파일로 따로 보관할 수 있어요.':'추가한 조합법은 이 미리보기에서 검색할 수 있습니다.'}</p>`;refreshIcons();}
  function openPicker(target){captureEditor();pickerTarget=target;pickerQuery='';pickerPage=0;renderPicker();}
  function renderPicker(){show('picker');$('cp-picker').innerHTML=backHead('아이템 선택','picker-back')+`<label class="cp-search">${ico('search')}<input id="cp-picker-query" type="search" aria-label="아이템 검색" placeholder="아이템 이름 또는 ID"></label><div id="cp-picker-list"></div><div class="cp-pager" id="cp-picker-pager"></div>${typeof pickerTarget==='number'?'<button class="cp-btn cp-wide" data-action="clear-slot">이 칸 비우기</button>':''}<details class="cp-panel" style="margin-top:16px"><summary>목록에 없는 모드 아이템 추가</summary><div style="padding-top:12px"><label class="cp-field">이름<input id="cp-new-name" placeholder="구리 톱니바퀴" maxlength="80"></label><label class="cp-field">ID<input id="cp-new-id" placeholder="my_mod:copper_gear" maxlength="100"></label><label class="cp-field">아이템 아이콘 (선택)<input id="cp-new-image" type="file" accept="image/png,image/webp,image/jpeg"></label><button class="cp-btn" data-action="new-item">이 아이템 사용</button><div id="cp-picker-error" class="cp-error" role="alert"></div></div></details>`;renderPickerList();}
  function renderPickerList(){const q=pickerQuery.trim().toLowerCase();const values=[...itemIndex.values()].filter(i=>[i.name,i.id,i.english].join(' ').toLowerCase().includes(q)).sort((a,b)=>compareItems(a.id,b.id));pickerPage=Math.min(pickerPage,Math.max(0,Math.ceil(values.length/pageSize)-1));$('cp-picker-list').innerHTML=values.slice(pickerPage*pageSize,pickerPage*pageSize+pageSize).map(i=>`<button class="cp-choice" data-action="choose-item" data-id="${esc(i.id)}">${icon(i.id)}<span>${esc(i.name)}<span class="cp-item-sub" style="display:block">${esc(i.id)}</span></span>${ico('plus')}</button>`).join('')||'<p class="cp-empty">아래에서 모드 아이템을 추가하세요.</p>';$('cp-picker-pager').innerHTML=values.length>pageSize?`<button class="cp-icon-btn" data-action="picker-prev" aria-label="이전 아이템" ${pickerPage===0?'disabled':''}>${ico('chevron-left')}</button><span>${pickerPage+1} / ${Math.ceil(values.length/pageSize)}</span><button class="cp-icon-btn" data-action="picker-next" aria-label="다음 아이템" ${(pickerPage+1)*pageSize>=values.length?'disabled':''}>${ico('chevron-right')}</button>`:'';refreshIcons();}
  function chooseItem(id){if(pickerTarget==='result'){editor.result=id;editor.name=name(id);}else{const i={options:[id],label:name(id)};if(typeof pickerTarget==='number')editor.grid[pickerTarget]=i;else editor.inputs.push(i);}renderEditor();}
  function saveEditor(){captureEditor();const fail=t=>{$('cp-editor-error').textContent=t;};editor.name=editor.name.trim();editor.result=editor.result.trim();if(!editor.name)return fail('결과 아이템 이름을 입력해 주세요.');if(!editor.result)editor.result='custom:item_'+Date.now().toString(36);if(!itemIndex.has(editor.result)&&!/^[a-z0-9_.-]+:[a-z0-9/._-]+$/.test(editor.result))return fail('ID는 my_mod:copper_gear처럼 영문 소문자로 입력해 주세요.');if(!Number.isInteger(editor.count)||editor.count<1||editor.count>999)return fail('수량은 1~999 사이의 정수로 입력해 주세요.');const ing=editor.kind==='crafting_shaped'?editor.grid.filter(Boolean):editor.inputs;if(!ing.length)return fail('재료를 하나 이상 추가해 주세요.');if(editor.kind==='crafting_shapeless'&&ing.length>9)return fail('제작대 재료는 최대 9개입니다.');if(['smelting','stonecutting'].includes(editor.kind)&&ing.length!==1)return fail('이 제작 방식은 재료 1개를 사용합니다.');if(state.custom.length>=(window.CraftPocketPWA?.maxCustomRecipes||8)&&!editor.editing)return fail(window.CraftPocketPWA?'사용자 조합법은 최대 500개까지 저장합니다.':'미리보기는 사용자 조합법을 최대 8개까지 저장합니다.');const existing=itemIndex.get(editor.result);if(!existing||!items.some(i=>i.id===editor.result)){const item={id:editor.result,name:editor.name,english:existing?.english||editor.name};state.customItems=state.customItems.filter(i=>i.id!==item.id).concat(item);}const used=new Set(ing.flatMap(i=>i.options));editor.items.filter(i=>used.has(i.id)).forEach(i=>{if(!state.customItems.some(v=>v.id===i.id))state.customItems.push(i);});const r={id:editor.id,kind:editor.kind,result:editor.result,count:editor.count,ingredients:ing,grid:editor.kind==='crafting_shaped'?editor.grid:null,notes:editor.notes.trim(),mod:editor.mod.trim(),special:false};state.custom=state.custom.filter(v=>v.id!==r.id).concat(r);if(editor.iconData)customIcons.set(r.result,editor.iconData);updateItems();selected=r.id;editor=null;state.tab='custom';state.query='';state.kind='';state.materials=[];const retained=persist();openRecipe(r.id,true);toast(retained?'내 조합법에 저장했어요. 검색과 재료 필터에도 포함됩니다.':window.CraftPocketPWA?'기기에 저장하지 못했습니다. 새로고침 전에 아래에서 백업 파일을 저장해 주세요.':'현재 미리보기에 추가했어요. 저장 한도를 넘어 새로 열면 이번 변경이 사라질 수 있어요.');}
  root.addEventListener('input',e=>{if(e.target.matches('[data-uses-query]')){const node=e.target.closest('[data-node-index]'),view=detailHistory[Number(node.dataset.nodeIndex)];if(view){view.usesQuery=e.target.value;const itemID=detailItemID(view);node.querySelector('.cp-uses-list').innerHTML=usageProductRows(itemID,view.usesQuery);node.querySelector('.cp-uses-list').scrollTop=0;node.querySelector('.cp-uses-matches').textContent=view.usesQuery?'검색 결과 '+usageProducts(itemID,view.usesQuery).length+'개 항목':'';refreshIcons();}return;}if(e.target.id==='cp-variant-query'){variantQuery=e.target.value;const p=browseValues.find(p=>p.id===openedProductID);if(p){$('cp-variant-options').innerHTML=variantChoices(p);refreshIcons();}}if(e.target.id==='cp-query'){state.query=e.target.value;page=0;clearInline();renderBrowse();persist();}if(e.target.id==='cp-material-query'){filterQuery=e.target.value;filterPage=0;renderMaterialList();}if(e.target.id==='cp-picker-query'){pickerQuery=e.target.value;pickerPage=0;renderPickerList();}});
  root.addEventListener('change',e=>{
    if(e.target.id==='cp-product-method'){selectProductRecipe(e.target.value);return;}
    if(e.target.id==='cp-output-image'||e.target.id==='cp-new-image'){
      const file=e.target.files?.[0],isOutput=e.target.id==='cp-output-image';if(!file)return;
      if(!['image/png','image/webp','image/jpeg'].includes(file.type)||file.size>262144){toast('아이콘은 256 KB 이하의 PNG, WebP, JPG를 선택해 주세요.');return;}
      const reader=new FileReader();reader.onload=()=>{if(!editor)return;if(isOutput){captureEditor();editor.iconData=String(reader.result);renderEditor();toast('모드 아이콘을 넣었어요. 이미지는 현재 미리보기에서 유지됩니다.');}else{editor.newIconData=String(reader.result);toast('재료 아이콘을 선택했어요.');}};reader.readAsDataURL(file);return;
    }
if(e.target.id==='cp-sort'){state.sort=e.target.value;page=0;clearInline();renderBrowse();persist();}
if(e.target.id==='cp-kind'){state.kind=e.target.value;page=0;clearInline();renderBrowse();persist();}if(e.target.id==='cp-editor-kind'){captureEditor();const old=editor.kind,next=e.target.value;const current=old==='crafting_shaped'?editor.grid.filter(Boolean):editor.inputs;if(next==='crafting_shaped'&&current.length>9){e.target.value=old;$('cp-editor-error').textContent='재료가 9개를 넘어요. 재료를 줄인 다음 변경하세요.';return;}if(next==='crafting_shaped')editor.grid=current.concat(Array(9-current.length).fill(null));else if(old==='crafting_shaped')editor.inputs=current;editor.kind=next;renderEditor();}});
  root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;const nodeIndex=Number(b.closest('[data-node-index]')?.dataset.nodeIndex??-1);if(nodeIndex>=0&&detailHistory[nodeIndex]?.type==='recipe')selected=detailHistory[nodeIndex].id;
    if(a==='tab'){clearInline();state.tab=b.dataset.tab;state.query='';state.kind='';state.materials=[];page=0;show('browse');renderBrowse();persist();}
    if(a==='back')closeDetails(detailHistory.length-1);
    if(a==='all-recipes'){clearInline();show('browse');renderBrowse();scrollToSection(-1);}
    if(a==='material-recipe')openMaterial(id,nodeIndex);
    if(a==='usage-recipe')openUsageRecipe(id,nodeIndex);
    if(a==='nested-recipe')openRecipe(id,false,nodeIndex);
    if(a==='collapse-node')closeDetails(nodeIndex);
    if(a==='scroll-parent')scrollToSection(nodeIndex-1);
    if(a==='method-prev'||a==='method-next'){detailHistory[nodeIndex].page=(detailHistory[nodeIndex].page||0)+(a==='method-prev'?-1:1);renderDetailView();scrollToSection(nodeIndex);}
    if(a==='add')beginEditor();
    if(a==='detail'){if(openedProductID===id&&detailHistory.length)closeDetails(0);else{variantQuery='';const p=browseValues.find(p=>p.id===id);if(p)openRecipe(p.recipes[0].id,true);}}
    if(a==='variant')selectProductRecipe(id);
    if(a==='favorite'){state.favorites=state.favorites.includes(selected)?state.favorites.filter(x=>x!==selected):state.favorites.concat(selected);renderBrowse();renderDetailView();persist();}
    if(a==='reset'){clearInline();state.query='';state.kind='';state.materials=[];page=0;renderBrowse();persist();}
    if(a==='filter'){filterQuery='';filterPage=0;renderFilter();}
    if(a==='filter-done'){page=0;clearInline();show('browse');renderBrowse();persist();}
    if(a==='match'){state.match=b.dataset.match;root.querySelectorAll('[data-action="match"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.match===state.match));persist();}
    if(a==='toggle-material'){state.materials=state.materials.includes(id)?state.materials.filter(x=>x!==id):state.materials.concat(id);renderMaterialList();persist();}
    if(a==='remove-material'){clearInline();state.materials=state.materials.filter(x=>x!==id);page=0;renderBrowse();persist();}
    if(a==='clear-materials'){state.materials=[];renderMaterialList();persist();}
    if(a==='material-prev'){filterPage--;renderMaterialList();}if(a==='material-next'){filterPage++;renderMaterialList();}
    if(a==='edit')beginEditor(allRecipes().find(r=>r.id===selected));
    if(a==='delete')b.closest('[data-node-index]').querySelector('.cp-delete-confirm').hidden=false;
    if(a==='confirm-delete'){clearInline();state.custom=state.custom.filter(r=>r.id!==selected);state.favorites=state.favorites.filter(x=>x!==selected);persist();show('browse');renderBrowse();toast('조합법을 삭제했어요.');}
    if(a==='cancel-editor'){editor=null;updateItems();show('browse');renderBrowse();renderDetailView();}
    if(a==='pick-slot')openPicker(Number(b.dataset.index));if(a==='pick-input')openPicker('input');if(a==='pick-result')openPicker('result');
    if(a==='picker-back')renderEditor();
    if(a==='choose-item')chooseItem(id);
    if(a==='clear-slot'){editor.grid[pickerTarget]=null;renderEditor();}
    if(a==='picker-prev'){pickerPage--;renderPickerList();}if(a==='picker-next'){pickerPage++;renderPickerList();}
    if(a==='remove-input'){captureEditor();editor.inputs.splice(Number(b.dataset.index),1);renderEditor();}
    if(a==='new-item'){const n=$('cp-new-name').value.trim(),i=$('cp-new-id').value.trim();if(!n||!/^[a-z0-9_.-]+:[a-z0-9/._-]+$/.test(i)){$('cp-picker-error').textContent='이름과 my_mod:item 형식의 ID를 입력하세요.';return;}if(!itemIndex.has(i)){const item={id:i,name:n,english:n};editor.items.push(item);itemIndex.set(i,item);}if(editor.newIconData)customIcons.set(i,editor.newIconData);editor.newIconData=null;chooseItem(i);}
    if(a==='save')saveEditor();
  });
  renderBrowse();
  const appearance={corners:18,density:'편안하게',palette:'숲'};
  function applyAppearance(){root.style.setProperty('--cp-radius',appearance.corners+'px');root.querySelectorAll('.cp-row').forEach(x=>x.style.paddingBlock=appearance.density==='촘촘하게'?'9px':'13px');if(appearance.palette==='흙'){root.style.setProperty('--cp-accent','light-dark(#805b35,#e1bd88)');root.style.setProperty('--cp-tint','light-dark(#f0e8dc,#51432f)');root.style.setProperty('--cp-hero','light-dark(#efe5d6,#433a2b)');}else{root.style.removeProperty('--cp-accent');root.style.removeProperty('--cp-tint');root.style.removeProperty('--cp-hero');}}
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyAppearance});tweak.addSelect(appearance,'palette',{label:'분위기',options:['숲','흙']});tweak.addSlider(appearance,'corners',{label:'모서리 둥글기',min:4,max:24,unit:'px'});}
})().catch(error=>{const area=document.getElementById('cp-recipes');if(area){area.textContent='아이콘과 조합법을 불러오지 못했습니다. 미리보기를 다시 열어 주세요.';}console.error(error);});
</script>

  <footer class="cp-pwa-tools cp-pwa-footer">
    <div id="cp-backup-controls"></div>
    <p>개인용 Minecraft 조합법 사전 · Minecraft의 공식 서비스가 아닙니다.</p>
  </footer>
  <noscript><p class="cp-pwa-tools">조합법을 표시하려면 Safari 설정에서 JavaScript를 켜 주세요.</p></noscript>
</body>
